name: Feature request
description: A new gate rule, node check, handoff field or setting
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The workflow where self-compact falls short today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like it to do. A concrete example of the moment it should (or should not) compact helps most.
    validations:
      required: true
